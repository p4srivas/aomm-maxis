{% extends "base.html" %}
{% block title %}AOMM - Criteria - Attributes{% endblock %}
{% block content %}
<main class="main-content">
    <form class="container mt-4" action="/criteria?access_token={{ access_token }}&session_id={{ session_id }}" method="get" name="theForm">
        <input type="hidden" name="access_token" id="access_token" value="{{ access_token }}">
        <input type="hidden" name="session_id" id="session_id" value="{{ session_id }}">
        <h2 class="text-primary">Criteria - Attributes</h2>

        <!-- Filter Section -->
        <div class="filter-section my-4 d-flex justify-content-center align-items-center gap-3">
            <select id="dimension-select" class="form-select form-select-sm">
                <option value="" disabled selected>Select Dimension</option>
                <option value="PARTY">Party</option>
                <option value="TECHNOLOGY">Technology</option>
                <option value="CULTURE">Culture</option>
                <option value="STRATEGY">Strategy</option>
                <option value="OPERATIONS">Operations</option>
                <option value="DATA">Data</option>
            </select>
            <select id="sub-dimension-select" class="form-select form-select-sm">
                <option value="" disabled>Select Sub-Dimension</option>
                <option value="{{ user_selection['sub_dimension'] }}" selected>{{ user_selection_text['sub_dimension'] }}</option>
            </select>
        </div>
        <!-- Table Section -->
        <!--<div class="table-responsive">-->
        <div style="font-size:24px;font-family:verdana;color:blue;text-align:center;"></div>
        <div style="font-size:14px;font-family:verdana;color:#1f56e0;text-align:left;vertical-align: top;">            
            {{ criteria_table | safe }}
        </div>
    </form>
</main>
{% endblock %}

{% block scripts %}
    <!-- Include DataTables -->
    <script src="/static/js/jquery-3.3.1.js"></script>
    <script src="/static/js/jquery.dataTables.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.display').DataTable({
                "scrollY": "760px",
                "scrollCollapse": true,
                "paging": true,
                "pageLength": 10,
                lengthMenu: [5, 10, 20],                
                searching: true,                
            });

            // Toggle sidebar
            $('.sidebar').hover(
                function() {
                    $(this).addClass('open');
                },
                function() {
                    $(this).removeClass('open');
                }
            );
        });
    </script>
    <style>
        .filter-section select {
            font-size: 0.85em;
            padding: 0.2em 0.5em;
        }
    </style>

    <script>
        $(document).ready(function() {
            // Initialize DataTable with Bootstrap styling
            $('#criteria_table').DataTable({
                paging: true,
                "pageLength": 5,
                lengthMenu: [5, 10, 20],                
                searching: true,
                ordering: true,
                scrollX: true,
                columnDefs: [
                    { orderable: false, targets: [3, 4, 5, 6, 7] } // Disable sorting for radio button columns
                ],
                language: {
                    search: "Search:",
                    lengthMenu: "Show _MENU_ entries per page",
                    zeroRecords: "No matching records found"
                }
            });

            // Mapping of dimensions to sub-dimensions
            const dimensionFilterValueMapping = {
                PARTY: { subDimension: ['1.1','1.2','1.3','1.4','1.5','1.6','1.7'] },
                STRATEGY: { subDimension: ['2.1','2.2','2.3','2.4','2.5'] },
                TECHNOLOGY: { subDimension: ['3.1','3.2','3.3','3.4'] },
                OPERATIONS: { subDimension: ['4.1','4.2','4.3','4.4','4.5','4.6'] },
                CULTURE: { subDimension: ['5.1','5.2','5.3','5.4','5.5'] },
                DATA: { subDimension: ['6.1','6.2','6.3','6.4'] }
            };

            // Mapping of dimensions to sub-dimensions
            const dimensionFilterTextMapping = {
                PARTY: { subDimension: ['Customer Engagement','Customer Experience','Customer Insight','Customer Trust','B2B2X Partner Engagement','Employee Engagement','Engagement of Smart Things'] },
                STRATEGY: { subDimension: ['Value Model','Business Architecture','Financial Management','Governance Framework','Sustainability Management'] },
                TECHNOLOGY: { subDimension: ['Autonomous Architecture','Technology Architecture','Technology Resources Management','Technology Lifecycle Management'] },
                OPERATIONS: { subDimension: ['Anomaly Resolution','Customer Network Experience Assurance','Customer Network Complaints Resolution','Customer Value Preservation and Uplift','Energy Optimization and Operations Carbon Footprint','Order Fulfillment'] },
                CULTURE: { subDimension: ['Innovation Culture','Quality Culture','Culture Management','Organization Alignment','Workplace Enablement'] },
                DATA: { subDimension: ['Data Life-Cycle Management','Data  Quality','Data Security','Data Monetization'] }
            };

            function removeOptions(selectElement) {
                var i, L = selectElement.options.length - 1;
                for(i = L; i >= 0; i--) {
                    selectElement.remove(i);
                }
                var el = document.createElement("option");
                el.value = "";
                el.textContent = "Select Sub-Dimension";
                selectElement.appendChild(el);
                selectElement.options[0].disable = true;
            }


            // Handle dimension select change
            $('#dimension-select').on('change', function() {
                const selectedDimension = $(this).val();
                if (dimensionFilterValueMapping[selectedDimension]) {
                    var select = document.getElementById("sub-dimension-select");
                    removeOptions(select);
                    for(var i = 0; i < dimensionFilterValueMapping[selectedDimension].subDimension.length; i++) {
                        var opt = dimensionFilterValueMapping[selectedDimension].subDimension[i];
                        var txt = dimensionFilterTextMapping[selectedDimension].subDimension[i];
                        var el = document.createElement("option");
                        el.value = opt;
                        el.textContent = txt;
                        select.appendChild(el);
                    }
                }
                console.log('Selected Filters:', {
                    dimension: $('#dimension-select').val(),
                    subDimension: $('#sub-dimension-select').val()
                });
            });

            // Handle additional dropdown filter functionality
            $('#sub-dimension-select').on('change', function() {
                const selectedDimension = $('#dimension-select').val()
                const selectedSubDimension = $(this).val();
                window.location = "/criteria?access_token=" + $('#access_token').val()+ "&session_id=" + $('#session_id').val() + "&dimension=" + selectedDimension + "&sub_dimension=" + selectedSubDimension;
                //console.log('Selected Filters:', { service, dimension, subDimension });
                console.log('Selected Filters:', {
                    access_token: $('#access_token').val(),
                    dimension: $('#dimension-select').val(),
                    subDimension: selectedSubDimension
                });                
            });

            // Handle additional dropdown filter functionality
            window.onload = function() {
                document.getElementById('dimension-select').value = "{{ user_selection['dimension'] }}"
                const selectedDimension = "{{ user_selection['dimension'] }}";
                const selectedSubDimension = "{{ user_selection['sub_dimension'] }}";
                var select = document.getElementById("sub-dimension-select");
                removeOptions(select);
                for(var i = 0; i < dimensionFilterValueMapping[selectedDimension].subDimension.length; i++) {
                    var opt = dimensionFilterValueMapping[selectedDimension].subDimension[i];
                    var txt = dimensionFilterTextMapping[selectedDimension].subDimension[i];
                    var el = document.createElement("option");
                    el.value = opt;
                    el.textContent = txt;
                    select.appendChild(el);
                }
                document.getElementById('sub-dimension-select').value = "{{ user_selection['sub_dimension'] }}"
            };            



        });
    </script>
{% endblock %}
